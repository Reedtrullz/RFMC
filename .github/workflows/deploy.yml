name: Manual VPS rollback

on:
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: Exact 40-character commit to restore on the VPS
        required: true

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy VirtualCDU
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deploy_sha }}

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Install community.docker collection
        run: ansible-galaxy collection install community.docker

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa_racknerd
          chmod 600 ~/.ssh/id_rsa_racknerd
          ssh-keyscan -H 198.23.137.16 >> ~/.ssh/known_hosts

      - name: Smoke test SSH connection
        run: |
          ssh -i ~/.ssh/id_rsa_racknerd -o IdentitiesOnly=yes deploy@198.23.137.16 "echo SSH_OK"

      - name: Run Ansible playbook
        env:
          DEPLOY_SHA: ${{ inputs.deploy_sha }}
          RFMS_VPS_ROLLBACK: '1'
        run: |
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          ANSIBLE_HOST_KEY_CHECKING=false ansible-playbook \
            -i inventory/hosts.yml ansible-playbook.yml \
            --extra-vars "deploy_sha=$DEPLOY_SHA" -vv
