name: Cloudflare Pages preview

on:
  workflow_run:
    workflows: ['CI']
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      production:
        description: Deploy the checked main commit to the production Pages branch
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pages:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && vars.CLOUDFLARE_DEPLOY_ENABLED == '1') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck:all
      - run: npm test -- --run
      - run: npm run build
      - name: Check Pages asset limits
        run: |
          test "$(find dist -type f | wc -l)" -le 20000
          test -z "$(find dist -type f -size +25M -print -quit)"
          test -f dist/_headers
          test -f dist/sw.js
      - name: Deploy Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=reidar-rfms --branch=${{ (github.event_name == 'workflow_run' || inputs.production) && 'main' || 'cloudflare-preview' }}
