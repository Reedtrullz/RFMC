name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Fast checks: typecheck + unit tests (no browser needed) ──
  lint-and-test:
    name: Typecheck & Unit Tests
    runs-on: ubuntu-latest
    env:
      AIRCRAFT_ADAPTER: mock
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm via Corepack (version pinned by packageManager)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (all workspaces)
        run: pnpm run typecheck:all

      - name: Lint check
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Unit tests + coverage
        run: pnpm run test:coverage

      - name: Build production bundle
        run: pnpm run build

      - name: Bundle size check
        run: |
          du -sh dist/ 2>/dev/null || echo "No dist/ directory — skipping bundle size check"

      - name: Status docs are consolidated
        run: pnpm run check:status-docs

  # ── Slower checks: E2E with Playwright (needs browser) ──
  e2e:
    name: E2E Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AIRCRAFT_ADAPTER: mock
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm via Corepack (version pinned by packageManager)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build production bundle
        run: pnpm run build

      - name: Qualify bounded loading guard
        if: github.event_name == 'workflow_dispatch' || github.head_ref == 'codex/perf-rfmc-icon-loading-20261031'
        run: node --test scripts/ci/loading-namespace.node-check.mjs && node scripts/ci/qualify-loading.mjs

      - name: Upload loading guard qualification
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.head_ref == 'codex/perf-rfmc-icon-loading-20261031') }}
        uses: actions/upload-artifact@v4
        with:
          name: loading-guard-qualification
          path: .qa/loading-qualification/
          retention-days: 14

      - name: Run E2E tests
        run: pnpm run test:e2e:ci
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14

  # ── Security audit: block high/critical production dependency issues ──
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm via Corepack (version pinned by packageManager)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  # ── Docker build verification: ensure image builds successfully ──
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t virtual-cdu:test .
