---
- name: Ensure system packages are installed
  apt:
    name:
      - curl
      - git
      - nginx
      - certbot
      - python3-certbot-nginx
      - ufw
    state: present
    update_cache: true

- name: Install Node.js {{ node_version }}
  shell: |
    curl -fsSL https://deb.nodesource.com/setup_{{ node_version }}.x | bash -
    apt-get install -y nodejs
  args:
    creates: /usr/bin/node
  when: ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu'

- name: Verify Node.js version
  command: node --version
  register: node_version_check
  changed_when: false

- name: Create app user
  user:
    name: "{{ app_user }}"
    state: present
    system: true
    create_home: false

- name: Create app directory
  file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

- name: Clone repository
  git:
    repo: "{{ repo_url }}"
    dest: "{{ app_dir }}"
    version: "{{ repo_branch }}"
    force: true
  become_user: "{{ app_user }}"
  notify: Restart CDU service

- name: Install npm dependencies
  command: npm ci
  args:
    chdir: "{{ app_dir }}"
  become_user: "{{ app_user }}"
  environment:
    PATH: "/usr/local/bin:/usr/bin:/bin"
  changed_when: false

- name: Build frontend
  command: npm run build
  args:
    chdir: "{{ app_dir }}"
  become_user: "{{ app_user }}"
  environment:
    PATH: "/usr/local/bin:/usr/bin:/bin"
    NODE_ENV: production
  changed_when: false

- name: Create production environment file
  template:
    src: .env.production.j2
    dest: "{{ app_dir }}/server/.env"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0640"
  notify: Restart CDU service

- name: Create systemd service
  template:
    src: cdu.service.j2
    dest: /etc/systemd/system/virtual-cdu.service
    mode: "0644"
  notify: Restart CDU service

- name: Enable and start systemd service
  systemd:
    name: virtual-cdu
    enabled: true
    state: started
    daemon_reload: true

- name: Create nginx site configuration
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/virtual-cdu
    mode: "0644"
  notify: Reload nginx

- name: Enable nginx site
  file:
    src: /etc/nginx/sites-available/virtual-cdu
    dest: /etc/nginx/sites-enabled/virtual-cdu
    state: link
  notify: Reload nginx

- name: Remove default nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Configure firewall
  ufw:
    rule: "{{ item }}"
    state: enabled
  loop:
    - allow 22/tcp
    - allow 80/tcp
    - allow 443/tcp
  when: ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu'

- name: Obtain SSL certificate
  command: >
    certbot --nginx
    -d {{ domain }}
    --non-interactive
    --agree-tos
    --email {{ letsencrypt_email }}
    --redirect
  args:
    creates: /etc/letsencrypt/live/{{ domain }}/fullchain.pem

- name: Ensure certbot renewal timer
  systemd:
    name: certbot.timer
    enabled: true
    state: started
