- name: Deploy VirtualCDU to VPS
  hosts: vps
  gather_facts: false
  vars:
    repo_url: "git@github.com:Reedtrullz/RFMC.git"
    app_dir: "/home/deploy/virtual-cdu"
    container_name: "virtual-cdu"
    host_port: "8082"
    container_port: "8080"
    public_origin: "https://fmc.reidar.tech"

  tasks:
    - name: Ensure app directory exists
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: deploy
        group: deploy
        mode: "0755"

    - name: Clone or pull repository
      git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: main
        force: true
      register: git_result

    - name: Build Docker image
      community.docker.docker_image:
        name: "{{ container_name }}"
        source: build
        build:
          path: "{{ app_dir }}"
        force_source: true
      register: build_result

    - name: Stop existing container
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: absent

    - name: Start container
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ container_name }}"
        state: started
        restart_policy: unless-stopped
        ports:
          - "127.0.0.1:{{ host_port }}:{{ container_port }}"
        memory: "512m"
        cpus: 1.0
        log_driver: "json-file"
        log_options:
          max-size: "10m"
          max-file: "3"
        healthcheck:
          test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:{{ container_port }}/health', r => process.exit(r.statusCode === 200 ? 0 : 1))\""]
          interval: 30s
          timeout: 10s
          retries: 3
          start_period: 20s
        env:
          NODE_ENV: production
          PORT: "{{ container_port }}"
          WS_ALLOWED_ORIGINS: "{{ public_origin }}"
          WS_MAX_MESSAGE_BYTES: "65536"

    - name: Wait for health check
      uri:
        url: "http://localhost:{{ host_port }}/health"
        return_content: true
        timeout: 5
      register: health_check
      until: health_check is succeeded and health_check.json.status == "ok"
      retries: 10
      delay: 5

    - name: Ensure Caddy config includes fmc.reidar.tech
      become: true
      blockinfile:
        path: /etc/caddy/Caddyfile
        block: |
          fmc.reidar.tech {
            reverse_proxy localhost:{{ host_port }}
          }
        marker: "# {mark} ANSIBLE MANAGED - VirtualCDU"
        create: false

    - name: Reload Caddy
      become: true
      systemd:
        name: caddy
        state: reloaded

    - name: Verify container is running
      community.docker.docker_container_info:
        name: "{{ container_name }}"
      register: container_info

    - name: Report deployment status
      debug:
        msg: "VirtualCDU deployed: {{ container_info.container.State.Status }} -> https://fmc.reidar.tech"
